name: jxl_coder
description: "JpegXL encoding and decoding for Flutter (Apple platforms via libjxl)"
version: 0.1.1
repository: "https://github.com/stephane-archer/flutter-jxl-coder"

environment:
  sdk: ^3.5.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: JxlCoderPlugin
      ios:
        pluginClass: JxlCoderPlugin
