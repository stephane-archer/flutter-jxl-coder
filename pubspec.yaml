name: jxl_coder
description: "JPEG-to-JPEG XL compression for Flutter, with byte-exact original JPEG and metadata recovery"
version: 1.0.0
repository: "https://github.com/stephane-archer/flutter-jxl-coder"

environment:
  sdk: ^3.5.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: JxlCoderPlugin
      ios:
        pluginClass: JxlCoderPlugin
      windows:
        pluginClass: JxlCoderPluginCApi
